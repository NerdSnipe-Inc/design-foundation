name: Doc snippets compile

# Compiles every ```swift fenced code block in README.md, CLAUDE.md, AGENTS.md, and the
# Cursor rule against the real package (scripts/check_doc_snippets.py). These
# files are fed directly to AI coding agents as ground truth — a snippet that
# doesn't compile means an agent using this repo will write broken code.

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "README.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - "Sources/**"
      - "scripts/check_doc_snippets.py"
      - "scripts/count_facts.py"
      - "docs/llms.txt"
      - "docs/**/*.html"
      - "docs/wiki/**"
      - "wiki/**"
      - ".github/workflows/doc-snippets.yml"

jobs:
  doc-snippets:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.app/Contents/Developer

      - name: Compile-check documentation snippets
        run: python3 scripts/check_doc_snippets.py

  # Every numeric claim in the agent-facing docs ("44 components", "5 presets", "8 popup styles", the
  # DesignFoundation version numbers, ...) must equal what scripts/count_facts.py derives from Sources/.
  # Pure Python, no Swift toolchain, so it is a cheap Linux job. Claims about Pro (screens, blocks, shells,
  # verticals) are verified from the Pro repo's CI, which reads this script's --json output.
  facts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Numeric claims in docs match the code
        run: |
          python3 scripts/count_facts.py --strict --check \
            README.md CLAUDE.md AGENTS.md '.cursor/rules/*.mdc' docs/llms.txt \
            docs/index.html docs/pro/index.html docs/integration/index.html \
            docs/foundation-way/index.html docs/use-cases/index.html docs/theme-presets/index.html \
            'docs/wiki/*.md' 'wiki/*.md'
