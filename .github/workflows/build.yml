name: Build matrix

# Builds the package with the oldest and newest Xcode this repository supports, for the macOS host AND for
# iOS and visionOS (`swift build` alone only exercises macOS, so the UIKit paths would never compile), and
# runs the tests on the newest Xcode.
#
# This is also the guard for SDK-gated code such as the iPhone Duo support (Xcode 27.1+): those APIs are
# wrapped in `#if compiler(>=6.4) && canImport(SwiftUI, _version: 8.1)` so they are compiled out on every
# older SDK. GitHub-hosted runners have no Xcode 27 yet, so these jobs prove the gate keeps that code out of
# the builds that must keep working (Xcode 16 and 26).

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/build.yml"

jobs:
  build:
    name: build (${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: Xcode_16.4
          - runner: macos-26
            xcode: Xcode_26.6
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcrun swiftc --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (macOS host)
        run: swift build

      - name: Build (iOS)
        run: xcodebuild build -scheme DesignFoundation -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

      - name: Build (visionOS)
        run: xcodebuild build -scheme DesignFoundation -destination 'generic/platform=visionOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO

  test:
    name: test (Xcode_26.6)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
